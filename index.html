<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title> Managent Contacs</title>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-avatar">You</div>
    <div>
      <div class="header-title">Your Contacts</div>
      <div class="header-status">Manage your chat contacts</div>
    </div>
    <button class="add-contact-btn">+</button>
  </header>

  <div class="main">
    <!-- Sidebar Contacts -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Cari kontak atau chat..." />
        </div>
      </div>  
      <div class="contacts-list" id="contactsList">
        <!-- Contacts loaded by JS -->
      </div>
    </aside>

    <!-- Chat Area -->
    <section class="chat-area" id="chatArea">
      <div class="chat-header">
        <div class="chat-header-avatar"></div>
        <div class="chat-header-info">
          <h3 id="chatTitle" style="color: white;">Pilih kontak</h3>
          <p id="chatStatus" style="color: white;">Klik kontak untuk chat</p>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages" style="color: white;">
        <div style="text-align: center; color: #8696a0; margin-top: 100px;">
          Pilih kontak untuk memulai chat
        </div>
      </div>
      <div class="chat-input">
        <input type="text" placeholder="Ketik pesan..." id="messageInput" />
        <button id="sendBtn">➤</button>
      </div>
    </section>
  </div>

  <!-- Add/Edit Contact Overlay -->
  <div class="overlay" id="contactOverlay">
    <div class="form-card">
      <h2 id="formTitle" style="color: white; text-align: center; font-family: TimesNewRoman;">Tambah Kontak</h2>
      <form id="contactForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label style="color: white; font-family: TimesNewRoman;">Nama</label>   
          <input type="text" id="contactName" required />
        </div>
        <div class="form-group">
          <label style="color: white; font-family: TimesNewRoman;">Nomor Telepon</label>
          <input type="tel" id="contactPhone" placeholder="+62..." required />
        </div>
        <div class="form-group">
          <label style="color: white; font-family: TimesNewRoman;">Status</label>
          <select id="contactStatus">
            <option value="online">Online</option>
            <option value="offline">Offline</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
